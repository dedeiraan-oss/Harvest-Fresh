  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    window.jsPDF = window.jspdf.jsPDF;

    function unduhDaftarHarga() {
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text("Daftar Harga Sayuran", 20, 20);

      const harga = [
        ["Bayam", "Rp 15.000 / kg"],
        ["Tomat", "Rp 26.000 / kg"],
        ["Wortel", "Rp 12.000 / kg"],
        ["Kubis", "Rp 9.000 / kg"],
      ];

      harga.forEach((item, i) => {
        doc.text(`${item[0]}: ${item[1]}`, 20, 40 + i * 10);
      });

      doc.save("daftar_harga_sayuran.pdf");
    }

    document.querySelector(".btn-secondary").addEventListener("click", unduhDaftarHarga);
  </script>
